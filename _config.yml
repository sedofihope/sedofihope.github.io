# Site settings
title: Sèdofi Hope Lanmayikpohoue
url: https://sedofihope.github.io
baseurl: ""

# Identity, shared by both language versions
author:
  name: Sèdofi Hope Lanmayikpohoue
  name_ascii: Sedofi Hope Lanmayikpohoue
  given_name: Sèdofi Hope
  family_name: Lanmayikpohoue
  # Institutional address first; the personal one is shown second, smaller.
  email: slanmayikpohoue@unstim.bj
  email_personal: sedofihope@gmail.com
  orcid: 0009-0000-9650-0365
  github: sedofihope
  linkedin: sedofihope
  # To be added once the CARI 2026 proceedings are indexed:
  # google_scholar: ""
  # dblp: ""

created: 2026-09-23

# Documents hosted in the repository. Each link stays hidden until its file
# exists. The CV follows the page language and falls back to the other one.
photo: /assets/photo.jpg
cv:
  en: /assets/cv-en.pdf
  fr: /assets/cv-fr.pdf

# News: number of entries shown on the home page. The others sit behind
# "Show more", or behind a link to /news/ once the archive is enabled
# (see README.md, "News archive").
news_limit: 8
news_archive: false

# Google Search Console: either drop the HTML verification file at the root
# of the repository, or put the meta tag token here.
# google_site_verification: ""

# Build
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
timezone: Africa/Porto-Novo

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - .jekyll-cache
