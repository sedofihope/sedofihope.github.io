# Documents hosted in the repository. Each link stays hidden until its file
# exists. The CV follows the page language and falls back to the other one.
photo: /assets/images/photo.jpeg
cv:
  en: /assets/cv/cv-en.pdf
  fr: /assets/cv/cv-fr.pdf

# News: number of entries shown on the home page. The others sit behind
# "Show more", or behind a link to /news/ once the archive is enabled
# (see README.md, "News archive").
news_limit: 5
news_archive: true

# Top bar: at most `nav_max` sections, chosen in this order of priority
# (they keep the page order in the bar); the others go to "Menu".
nav_max: 6
nav_priority: [about, research, publications, talks, teaching, news, awards, education, service, experience, skills]

# Google Search Console: either drop the HTML verification file at the root
# of the repository, or put the meta tag token here.
google_site_verification: "S4T9KQJ_LW6W4IDrcLkefRWh2q7zWSxO1p4_zz_9io0"

# Build
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
timezone: Africa/Porto-Novo

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - .jekyll-cache
  - 20*.txt
  - 20*.md
  - session*.md
