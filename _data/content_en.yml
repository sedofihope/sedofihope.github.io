about: |
  I am a doctoral student in Engineering Sciences, specialising in Computer Science and Artificial Intelligence, at the [National University of Sciences, Technologies, Engineering and Mathematics (UNSTIM)](https://www.unstim.bj), Benin, where I also work as a teaching assistant in computer engineering. I received my engineering degree in 2024 from the National Higher School of Mathematical Engineering and Modelling (ENSGMM), where my final-year thesis dealt with the automated detection of XSS and SQL injection vulnerabilities through code property graphs and graph neural networks, under the supervision of Dr Ing. Géraud Azehoun Pazou, who also supervises my doctoral research.

  My work sits at the intersection of artificial intelligence and security. It now extends to AI-based environmental monitoring, which is the subject of my doctoral project on inland water bodies in Benin.

  I am open to collaboration and discussion, so please feel free to get in touch.

research:
  - label: AI for Cybersecurity
    text: machine learning and graph-based methods applied to security problems, with a focus on the automated detection of vulnerabilities in source code
  - label: AI for Environmental Monitoring
    text: remote sensing, hydrodynamic modelling and deep learning applied to inland water bodies (doctoral project)
  - label: Digital Forensics
    text: an emerging interest, in particular the use of learning-based methods to support investigation and evidence analysis

# Reverse chronological order, most recent first. Each entry: a bold title,
# two or three sentences, and optional links. A link with `file` instead of
# `url` points to a document in the repository and stays hidden until the
# file exists. In `text`, {count_clause} is replaced by `count_clause` (with
# {count} filled in) once `count` is set, and removed otherwise.
news:
  - date: October 2026
    title: CARI 2026
    text: Presentation of our paper on graph-based vulnerability detection at the 18th African Conference on Research in Computer Science and Applied Mathematics, held at the University of Abomey-Calavi from 21 to 24 October. CARI is the main pan-African forum for research in computer science and applied mathematics.
    links:
      - label: cari-conf.bj
        url: https://cari-conf.bj/
  - date: September 2026
    title: Two abstracts accepted at the 3rd UNSTIM International Scientific Colloquium
    text: Both abstracts have been accepted for the colloquium held on the Abomey campus from 13 to 16 October 2026, on the theme of science, technology, engineering, mathematics and innovation for sustainable development. The first, on AI-based detection of software vulnerabilities, was accepted as a poster; the second, on computer vision for precision agriculture, as an oral presentation.
  - date: June 2026
    title: Paper accepted at CARI 2026
    text: Our work on the automated detection of vulnerabilities in source code, based on code property graphs and a heterogeneous graph transformer, has been accepted at CARI 2026. The paper will appear in the Lecture Notes in Computer Science series published by Springer.
  - date: November 2025
    title: Workshop on retrieval-augmented generation
    text: Ran a hands-on workshop entitled "Build your own document chatbot with RAG" at the Benin Workshop on Artificial Intelligence (BWAI 2025), University of Abomey-Calavi. The session walked participants through document indexing, retrieval and answer generation, and ended with a working prototype built by each participant.
    links:
      - label: bwai-ifri-uac.bj
        url: https://bwai-ifri-uac.bj
      - label: Slides (PDF)
        file: /assets/slides-bwai-2025.pdf
  - date: October 2025
    title: Third prize at the ASIN AI Hackathon
    text: Third place at the artificial intelligence hackathon organised by the Agency for Information Systems and Digital Technology (ASIN Benin){count_clause}.
    count: "" # TODO number of teams
    count_clause: ", {count} teams taking part"
  - date: August 2025
    title: ACP Summer School, first African edition
    text: Attended the 20th summer school of the Association for Constraint Programming, held at IFRI, University of Abomey-Calavi. The programme focused on constraint programming for sustainable development, with hands-on modelling and solving sessions.
    links:
      - label: school.a4cp.org
        url: https://school.a4cp.org/summer2025/
  - date: June 2025
    title: CITA 2025 and remote sensing training
    text: Took part in the conference of Benin's National Academy of Sciences, Arts and Letters devoted to information technology for sustainable agriculture, and followed the training session on drones and remote sensing. This is the field my doctoral work now builds on.
  - date: June 2025
    title: Finalist at HackerLab 2025
    text: Reached the final of the national cybersecurity competition organised by ASIN Benin{count_clause}. Third consecutive year as a finalist.
    count: "" # TODO number of participants
    count_clause: ", {count} participants taking part"

