about: |
  I am a doctoral student in Engineering Sciences, specialising in Computer Science and Artificial Intelligence, at the [National University of Sciences, Technologies, Engineering and Mathematics (UNSTIM)](https://www.unstim.bj), Benin, where I also work as a teaching assistant in computer engineering. I received my engineering degree in 2024 from the National Higher School of Mathematical Engineering and Modelling (ENSGMM), where my final-year thesis dealt with the automated detection of XSS and SQL injection vulnerabilities through code property graphs and graph neural networks, under the supervision of Dr Ing. Géraud Azehoun Pazou, who also supervises my doctoral research.

  My work sits at the intersection of artificial intelligence and security. It now extends to AI-based environmental monitoring, which is the subject of my doctoral project on inland water bodies in Benin.

  I am open to collaboration and discussion, so please feel free to get in touch.

research:
  - label: AI for Cybersecurity
    text: machine learning and graph-based methods applied to security problems, with a focus on the automated detection of vulnerabilities in source code
  - label: AI for Environmental Monitoring
    text: remote sensing, hydrodynamic modelling and deep learning applied to inland water bodies (doctoral project)
  - label: Digital Forensics
    text: an emerging interest, in particular the use of learning-based methods to support investigation and evidence analysis

