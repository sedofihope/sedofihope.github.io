about: |
  Je suis doctorant en Sciences de l'Ingénieur, spécialité Informatique et Intelligence Artificielle, à l'[Université Nationale des Sciences, Technologies, Ingénierie et Mathématiques (UNSTIM)](https://www.unstim.bj), au Bénin, où je suis également assistant d'enseignement en génie informatique. J'ai obtenu mon diplôme d'ingénieur en 2024 à l'École Nationale Supérieure de Génie Mathématique et Modélisation (ENSGMM), avec un mémoire sur la détection automatique des vulnérabilités XSS et par injection SQL à l'aide des graphes de propriétés de code et des réseaux de neurones sur graphes, sous la direction du Dr Ing. Géraud Azehoun Pazou, qui encadre également mes travaux de doctorat.

  Mes travaux se situent à l'intersection de l'intelligence artificielle et de la sécurité. Ils s'étendent aujourd'hui à la surveillance environnementale par l'IA, objet de mon projet de thèse sur les plans d'eau continentaux du Bénin.

  Je suis ouvert aux collaborations et aux échanges, n'hésitez donc pas à me contacter.

research:
  - label: IA pour la cybersécurité
    text: apprentissage automatique et méthodes à base de graphes appliqués aux problèmes de sécurité, avec un intérêt pour la détection automatique des vulnérabilités dans le code source
  - label: IA pour la surveillance environnementale
    text: télédétection, modélisation hydrodynamique et apprentissage profond appliqués aux plans d'eau continentaux (projet de thèse)
  - label: Investigation numérique
    text: axe émergent, notamment l'apport des méthodes d'apprentissage à l'analyse de preuves et à la conduite d'investigations

# Ordre antichronologique, la plus récente en haut. Mêmes conventions que
# content_en.yml (titre, texte, liens, {count_clause}).
news:
  - date: octobre 2026
    title: CARI 2026
    text: Présentation de notre article sur la détection de vulnérabilités par graphes à la 18e Conférence Africaine sur la Recherche en Informatique et en Mathématiques Appliquées, à l'Université d'Abomey-Calavi, du 21 au 24 octobre. CARI est le principal forum panafricain de recherche en informatique et mathématiques appliquées.
    links:
      - label: cari-conf.bj
        url: https://cari-conf.bj/
  - date: septembre 2026
    title: Deux résumés acceptés au 3e Colloque Scientifique International de l'UNSTIM
    text: Les deux résumés sont retenus pour le colloque qui se tient sur le campus universitaire d'Abomey du 13 au 16 octobre 2026, sur le thème des STIM et de l'innovation technologique pour le développement durable. Le premier, sur la détection des vulnérabilités logicielles par l'IA, est accepté en poster ; le second, sur la vision par ordinateur pour l'agriculture de précision, en communication orale.
  - date: juin 2026
    title: Article accepté à CARI 2026
    text: Nos travaux sur la détection automatique des vulnérabilités dans le code source, fondés sur les graphes de propriétés de code et un transformer sur graphes hétérogènes, sont acceptés à CARI 2026. L'article paraîtra dans la série Lecture Notes in Computer Science de Springer.
  - date: novembre 2025
    title: Atelier sur la génération augmentée par recherche
    text: Animation d'un atelier pratique intitulé « Créez votre chatbot documentaire avec le RAG » au Benin Workshop on Artificial Intelligence (BWAI 2025), à l'Université d'Abomey-Calavi. La séance a couvert l'indexation documentaire, la recherche de passages, la génération de réponses, ainsi que des techniques avancées, et s'est conclue par une démonstration.
    links:
      - label: bwai-ifri-uac.bj
        url: https://bwai-ifri-uac.bj
      - label: Diapositives (PDF)
        file: /assets/slides-bwai-2025.pdf
  - date: octobre 2025
    title: Troisième prix au Hackathon IA de l'ASIN
    text: Troisième place au hackathon d'intelligence artificielle organisé par l'Agence des Systèmes d'Information et du Numérique (ASIN Bénin){count_clause}.
    count: "16" # TODO nombre d'équipes
    count_clause: ", parmi {count} équipes en finale"
  - date: août 2025
    title: ACP Summer School, première édition africaine
    text: Participation à la 20e école d'été de l'Association for Constraint Programming, à l'IFRI, Université d'Abomey-Calavi. Le programme portait sur la programmation par contraintes au service du développement durable, avec des séances pratiques de modélisation et de résolution.
    links:
      - label: school.a4cp.org
        url: https://school.a4cp.org/summer2025/
  - date: juin 2025
    title: CITA 2025 et formation en télédétection
    text: Participation à la conférence de l'Académie Nationale des Sciences, Arts et Lettres du Bénin consacrée aux TIC pour une agriculture durable, et suivi de la formation « Drones et télédétection pour une agriculture durable ». C'est le domaine sur lequel s'appuient aujourd'hui mes travaux de thèse.
  - date: juin 2025
    title: Finaliste du HackerLab 2025
    text: Finale de la compétition nationale de cybersécurité organisée par l'ASIN Bénin{count_clause}. Troisième année consécutive en finale.
    count: "161"
    count_clause: ", avec 20 équipes en finale sur {count} en lice"

